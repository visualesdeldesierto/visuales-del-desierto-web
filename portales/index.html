<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b0e">
  <meta name="description" content="Portales: una ventana audiovisual de Visuales del Desierto.">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <title>Portales — Visuales del Desierto</title>
  <link rel="stylesheet" href="/portales/styles.css">
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
<main id="experience" aria-live="polite">
  <section id="intro" class="panel" aria-labelledby="portal-title">
    <p class="eyebrow">Visuales del Desierto presenta</p>
    <h1 id="portal-title">Portales</h1>
    <p class="intro-copy">Apunta al marco para abrir el portal.</p>
    <button id="start-button" class="primary-button" type="button">Entrar</button>
    <p class="privacy-note">La cámara se procesa en tu dispositivo. No necesitas registrarte.</p>
  </section>
  <section id="status-card" class="status-card" hidden>
    <span class="status-dot" aria-hidden="true"></span><p id="status-text">Preparando experiencia…</p>
  </section>
  <section id="artwork-card" class="artwork-card" hidden>
    <p class="eyebrow">Portal 01</p><h2>Umbral en movimiento</h2>
  </section>
  <button id="retry-button" class="secondary-button" type="button" hidden>Intentar de nuevo</button>
  <button id="play-button" class="secondary-button" type="button" hidden>Reproducir obra</button>
  <a-scene id="ar-scene"
    mindar-image="imageTargetSrc: /portales/assets/targets/portal-01-cactus.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; warmupTolerance: 5; missTolerance: 5"
    color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
    <a-assets timeout="15000">
      <video id="portal-video" data-src="/portales/assets/video/portal-01-web.mp4" preload="none" muted playsinline webkit-playsinline loop crossorigin="anonymous"></video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="portal-target" mindar-image-target="targetIndex: 0">
      <a-plane id="portal-plane" position="0 0 0.01" width="1" height="0.5625" material="shader: flat; transparent: false"></a-plane>
    </a-entity>
  </a-scene>
  <noscript>Activa JavaScript para abrir este portal.</noscript>
</main>
<script src="/portales/app.js"></script>
</body>
</html>
